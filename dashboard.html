<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Dashboard</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--fg:#1d1d1b;--mute:#6b6b66;--line:#e4e4df;
 --codex:#2f6fde;--agy:#d9822b;--claude:#b4572e;--ok:#2e8b57;--bad:#c0392b;--run:#7a5af5}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--fg:#ececea;--mute:#9a9a94;--line:#33332f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 12px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:100px}
.stat b{display:block;font-size:24px}
.stat span{color:var(--mute);font-size:12px}
.row{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;
 padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.kids{margin-left:22px;padding-left:12px;border-left:2px dashed var(--line)}
.mgr{font-size:12px;color:var(--mute)}
.root{border-left-color:var(--fg)}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.agent{color:var(--c);font-weight:600}
.meta,.task{color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.badge{font-size:12px;padding:1px 8px;border-radius:99px;color:#fff;background:var(--s)}
.time{font-variant-numeric:tabular-nums;text-align:right}
.sum{grid-column:1/-1;font-size:13px;overflow-wrap:anywhere}
.empty{color:var(--mute)}
.err{color:var(--bad)}
</style>
</head>
<body>
<h1>Agents</h1>
<div class="stats" id="stats"></div>
<div id="list"><p class="empty">No agents yet. Waiting for status.jsonl…</p></div>
<script>
const COLORS = {codex:'var(--codex)', agy:'var(--agy)', claude:'var(--claude)'};
const STATUS = {running:'var(--run)', done:'var(--ok)', failed:'var(--bad)', timeout:'var(--bad)'};
let agents = {};

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(sec){ sec = Math.max(0, Math.round(sec)); return sec >= 60 ? `${Math.floor(sec/60)}m${String(sec%60).padStart(2,'0')}s` : `${sec}s`; }

// Merge start/end events per id: the last event wins per field, the first ts is the start time.
function reduce(text){
  const out = {};
  for (const line of text.split('\n')) {
    if (!line.trim()) continue;
    let e; try { e = JSON.parse(line); } catch { continue; }  // skip a half-written last line
    const a = out[e.id] ??= {start: e.ts};
    Object.assign(a, e);
    if (e.status !== 'running') a.end = e.ts;
  }
  return out;
}

function row(a, kids){
  const now = Date.now()/1000;
  const secs = (a.end ?? now) - a.start;
  return `<div class="row" style="--c:${COLORS[a.agent] || 'var(--mute)'}">
    <div class="top"><span class="agent">${esc(a.agent)}</span><b>${esc(a.id)}</b>
      <span class="badge" style="--s:${STATUS[a.status] || 'var(--mute)'}">${esc(a.status)}</span>
      <span class="meta">${esc(a.model)}${a.effort && a.effort !== '-' ? ' · ' + esc(a.effort) : ''}${a.mode === 'ro' ? ' · read-only' : ''}</span>
      ${kids ? `<span class="mgr">manages ${kids}</span>` : ''}</div>
    <div class="time">${fmt(secs)}</div>
    <div class="task">${esc(a.dir)} — ${esc(a.task)}</div>
    ${a.summary ? `<div class="sum">${esc(a.summary)}</div>` : ''}
  </div>`;
}

// Recursive: any depth (orchestrator -> sub-orchestrators -> workers).
function tree(list, parentId){
  return list.filter(a => a.parentKey === parentId).sort((a, b) => a.start - b.start).map(a => {
    const kids = list.filter(c => c.parentKey === a.id).length;
    return row(a, kids) + (kids ? `<div class="kids">${tree(list, a.id)}</div>` : '');
  }).join('');
}

function render(){
  const list = Object.values(agents);
  if (!list.length) return;
  const n = s => list.filter(a => a.status === s).length;
  document.getElementById('stats').innerHTML =
    [['Running', n('running')], ['Done', n('done')], ['Failed', n('failed') + n('timeout')], ['Total', list.length]]
    .map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
  const ids = new Set(list.map(a => a.id));
  // Unknown or missing parent -> managed directly by the orchestrator.
  for (const a of list) a.parentKey = a.parent && a.parent !== '-' && ids.has(a.parent) ? a.parent : '__root';
  const direct = list.filter(a => a.parentKey === '__root').length;
  document.getElementById('list').innerHTML =
    `<div class="row root"><div class="top"><span class="agent">claude</span><b>orchestrator</b>
       <span class="meta">this Claude Code session</span><span class="mgr">manages ${direct}</span></div><div></div></div>
     <div class="kids">${tree(list, '__root')}</div>`;
}

async function poll(){
  try {
    const res = await fetch('status.jsonl?t=' + Date.now());
    if (res.ok) agents = reduce(await res.text());
  } catch (e) {
    document.getElementById('list').innerHTML = `<p class="err">Cannot read status.jsonl: open this page through an HTTP server, not file://</p>`;
  }
  render();
}
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
