<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#26231f;--ink2:#5b554c;--line:#d9cfbf;--bg:#efe8dc;--paper:#f8f4ec;--card:#fbf8f2;--mut:#8a8173;
 --claude:#d97757;--codex:#26231f;--google:#4285f4;--ok:#6fae5a;--warn:#e6b84a;--hot:#e0564b;
 --chipY:#f6e7a8;--chipG:#d6ebc4;--chipL:#e1dcf5;--chipR:#f7dcd8}
*{box-sizing:border-box}
body{margin:0;font-family:"JetBrains Mono",ui-monospace,monospace;color:var(--ink);background:var(--bg);font-size:13px}
.grid{background-color:var(--paper);background-image:linear-gradient(30deg,#00000008 1px,transparent 1px),linear-gradient(150deg,#00000008 1px,transparent 1px);background-size:34px 20px}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--bg)}
.logo{width:32px;height:32px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--chipG)}
h1{margin:0;font-size:19px;font-weight:700}
h1 i{font-style:normal;background:var(--chipG);padding:0 4px;border-radius:4px}
.sub{font-size:11px;color:var(--mut)}
.right{margin-left:auto;display:flex;gap:8px}
.btn{border:1.5px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink);padding:5px 10px;font:inherit;font-size:11px;box-shadow:2px 2px 0 var(--ink)}
.btn.on{background:var(--chipG)}
.quota{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px 18px;background:var(--bg)}
.qc{border:1.5px solid var(--ink);border-radius:12px;background:var(--card);padding:10px 12px;box-shadow:3px 3px 0 var(--ink);position:relative}
.qc:before{content:"";position:absolute;left:12px;right:12px;top:-1px;height:4px;border-radius:0 0 4px 4px;background:var(--c)}
.qh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.mark{width:26px;height:26px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:7px;background:#fff}
.qr{display:flex;justify-content:space-between;font-size:11px;margin-top:9px;color:var(--mut)}
.qr b{color:var(--ink);background:var(--chipY);padding:0 6px;border-radius:6px;border:1px solid var(--ink)}
.bar{height:9px;border:1.5px solid var(--ink);border-radius:6px;margin-top:4px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%}
.ok{background:var(--ok)}.warn{background:var(--warn)}.hot{background:var(--hot)}
.unk{font-size:11px;color:var(--mut);margin-top:10px;line-height:1.6}
main{display:grid;grid-template-columns:1fr 420px;gap:14px;padding:0 18px 18px;min-height:520px;background:var(--bg)}
.pane{border:1.5px solid var(--line);border-radius:14px;position:relative;overflow:hidden;background:var(--paper)}
.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);font-weight:700}
.ph .cnt{margin-left:auto;font-size:11px;font-weight:400}
.ph .cnt span{border:1px solid var(--ink);border-radius:7px;padding:1px 7px;margin-left:4px}
.tree{padding:16px}
.node{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:8px 10px;margin:8px 0;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;align-items:center;box-shadow:2px 2px 0 var(--c)}
.node:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--c)}
.node.sel{outline:2px solid var(--ink);outline-offset:1px}
.node .id{font-weight:700}
.node .meta{font-size:11px;color:var(--mut)}
.node .act{grid-column:2/4;font-size:11px;color:var(--ink2)}
.node .sw{grid-column:2/4;font-size:11px;background:var(--chipR);border:1px solid var(--hot);border-radius:6px;padding:2px 6px;justify-self:start}
.dot{width:11px;height:11px;border-radius:50%;background:var(--s);border:1.5px solid var(--ink)}
.run{--s:var(--warn);animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.35}}
.done{--s:var(--ok)}.fail{--s:var(--hot)}
.kids{margin-left:22px;padding-left:14px;border-left:2px dotted var(--mut)}
.time{font-size:11px;border:1px solid var(--ink);border-radius:7px;padding:1px 7px;background:#fff}
.panel .tabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.tab{padding:5px 10px;font-size:11px;border:1.5px solid var(--ink);border-radius:8px;cursor:pointer;background:#fff}
.tab.on{background:var(--chipG);box-shadow:2px 2px 0 var(--ink)}
.pbody{padding:14px;font-size:12px;line-height:1.55;max-height:470px;overflow:auto}
.ev{border-left:2px dotted var(--mut);padding:2px 0 10px 12px;position:relative}
.ev:before{content:"";position:absolute;left:-6px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--warn);border:1.5px solid var(--ink)}
.ev .t{color:var(--mut);font-size:10px}
.ev code{display:block;background:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:5px 7px;margin-top:4px;white-space:pre-wrap}
.msg{border:1.5px solid var(--ink);border-radius:10px;padding:8px;margin:8px 0;background:#fff}
.msg.u{background:var(--chipL)}
.msg .who{font-size:10px;color:var(--mut);font-weight:700}
.note{font-size:11px;color:var(--mut);padding:8px 18px;background:var(--bg);margin:0}
</style><style>
main{grid-template-columns:minmax(0,1fr) 420px} @media(max-width:900px){main{grid-template-columns:1fr}.pbody{max-height:340px}}
.node{cursor:pointer}.ev{overflow-wrap:anywhere}.empty{padding:16px;color:var(--mut)}
.fetch-errors{padding:8px 18px;color:#8f332c;background:#f7dcd8;font-size:11px}.fetch-errors[hidden]{display:none}
body{height:100vh;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.pools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pool{border-top:1px dashed var(--line);padding-top:4px;margin-top:6px;min-width:0}
.pn{font-size:11px;font-weight:700;margin-top:4px}.pm{font-size:10px;color:var(--mut)}
.upd{font-size:10px;color:var(--mut);margin-top:8px}
.chips{position:sticky;top:0;z-index:1;display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;background:var(--bg);padding:2px 0}
.chip{border:1.5px solid var(--ink);border-radius:8px;padding:3px 9px;font-size:12px;background:#fff;cursor:pointer;user-select:none}
.chip.on{outline:2px solid var(--ink);outline-offset:1px;box-shadow:2px 2px 0 var(--ink)}
.chip[data-filter="running"]{background:#f6e7a8}
.chip[data-filter="done"]{background:#d6ebc4}
.chip[data-filter="failed"]{background:#f4c7c2;border-color:#e0564b}
main{flex:1;align-items:stretch;min-height:460px;height:auto}
main>.pane{display:flex;flex-direction:column;min-height:0}
main .tree,main .pbody{flex:1;overflow:auto;min-height:0;max-height:none}
.node{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);box-shadow:2px 2px 0 var(--ink)}
.node.running{background:#f6e7a8;border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.node.done{opacity:1;border-style:solid;background:#d6ebc4;box-shadow:2px 2px 0 var(--ok);padding:4px 9px;font-size:12px}
.node.failed{background:#f4c7c2;border-color:#e0564b;box-shadow:2px 2px 0 #e0564b}
.node .tm{margin-left:auto;font-size:11px;border:1px solid var(--ink);border-radius:7px;padding:1px 7px;background:#fff}
.node.running .tm{font-weight:700;font-size:13px}
.node .vend{font-size:10px;padding:0 6px;border-radius:6px;color:#fff}
.node .wave{font-size:10px;border:1px solid var(--ink);border-radius:6px;padding:0 6px;background:var(--chipL)}
.node .sum{flex-basis:100%;font-size:11px;opacity:.85}
.dot.run{background:var(--warn);animation:pulse 1.2s infinite}.dot.done{background:var(--ok);animation:none}.dot.fail{background:var(--hot);animation:none}
@media(max-width:900px){body{height:auto;min-height:100vh;overflow:visible}main{height:auto;flex:none;grid-template-columns:1fr}main .tree,main .pbody{max-height:70vh}}
</style></head><body>
<header><div class="logo">◇</div><div><h1>Agent <i>Dashboard</i></h1><div class="sub">multi-agent · live</div></div><div class="right"><span id="updated" class="btn">updated —</span><span class="btn">⟳ 2s</span><span class="btn on">☀</span></div></header>
<section class="quota" id="quota"></section><div id="fetch-errors" class="fetch-errors" role="status" hidden></div><main><div class="pane grid"><div class="ph">Agent tree <span class="cnt" id="counts"></span></div><div class="tree" id="tree"><p class="empty">Waiting for status.jsonl…</p></div></div>
<div class="pane panel" id="panel"><div class="ph"><span id="ptitle">Select an agent</span><span class="cnt" id="pmeta"></span><button class="btn" style="margin-left:auto" onclick="closePanel()">✕</button></div>
<div class="tabs"><span class="tab on" onclick="showTab('log',this)">Live log</span><span class="tab" onclick="showTab('conv',this)">Conversation</span><span class="tab" onclick="showTab('task',this)">Task</span></div>
<div class="pbody" id="log"></div><div class="pbody" id="conv" hidden></div><div class="pbody" id="task" hidden></div></div></main>
<script>
// <pure>
function parseJsonl(text){return text.split('\n').filter(x=>x.trim()).flatMap(x=>{try{return [JSON.parse(x)]}catch{return []}})}
function reduceStatus(text){const out={};for(const e of parseJsonl(text)){if(!e.id)continue;const a=out[e.id]??={start:e.ts};Object.assign(a,e);if(e.status!=='running')a.end=e.ts}return out}
function latestActivity(events){for(let i=events.length-1;i>=0;i--)if(events[i].kind!=='end')return events[i].text||'';return ''}
function quotaLevel(used,window){return used >= (window==='5h'?.85:.90)?'hot':used>=.70?'warn':'ok'}
function ageText(seconds){return seconds<60?'just now':seconds<3600?`${Math.floor(seconds/60)} min ago`:`${Math.floor(seconds/3600)} h ago`}
function conversation(events){return events.filter(e=>['prompt','message','tool','tool_result'].includes(e.kind))}
function rootAgents(agents){const ids=new Set(Object.keys(agents));return Object.values(agents).filter(a=>!a.parent||a.parent==='-'||!ids.has(a.parent))}
function eventsFromResponse(text){return text===null?[]:parseJsonl(text)}
function eventFetchError(file,message){return file.endsWith('.events.jsonl')&&message==='404'?'':message}
function waveTag(agent){return agent&&agent.wave?`wave ${agent.wave}`:''}
function statusGroup(status){return status==='running'?'running':status==='done'?'done':'failed'}
function filterTree(agents,filter){const ids=new Set();for(const [id,a] of Object.entries(agents)){if(filter==='all'||statusGroup(a.status)===filter){let current=id;while(current&&agents[current]&&!ids.has(current)){ids.add(current);current=agents[current].parent}}}return ids}
function sortSiblings(list,now){const order={running:0,failed:1,done:2};return [...list].sort((a,b)=>{const group=statusGroup(a.status),other=statusGroup(b.status);if(order[group]!==order[other])return order[group]-order[other];return group==='running'?((b.end??now)-b.start)-((a.end??now)-a.start):0})}
function counts(agents){const out={running:0,done:0,failed:0,all:Object.keys(agents).length};for(const a of Object.values(agents))out[statusGroup(a.status)]++;return out}
function agyPoolView(pool,now){if(!pool||!pool.five_hour||pool.five_hour.resets_at<=now)return null;const viewWindow=(window,name)=>!window||window.resets_at<=now?null:{used:window.used,level:quotaLevel(window.used,name),resets_at:window.resets_at};return {five_hour:viewWindow(pool.five_hour,'5h'),week:viewWindow(pool.week,'week'),age_text:pool.updated==null?'unknown':ageText(Math.max(0,now-pool.updated))}}
Object.assign(window,{parseJsonl,reduceStatus,latestActivity,quotaLevel,ageText,conversation,rootAgents,eventsFromResponse,eventFetchError,statusGroup,filterTree,sortSiblings,counts,agyPoolView});
// </pure>
const COLORS={claude:'var(--claude)',codex:'var(--codex)',agy:'var(--google)'};const MARKS={claude:'<svg viewBox="0 0 24 24" width="22" height="22"><g stroke="#d97757" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></g></svg>',codex:'<svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="3" width="18" height="18" fill="#26231f"/><path d="M8 9l3 3-3 3M13 15h4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',agy:'<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6z" fill="#4285f4"/></svg>'};let agents={},quota={},selected='',events=[],fetchErrors={};let tabId='log',statusFilter='running';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(file){try{const r=await fetch(file+'?t='+Date.now());if(!r.ok)throw Error(r.status);fetchErrors[file]='';return await r.text()}catch(e){fetchErrors[file]=eventFetchError(file,String(e.message||e));return null}}
function quotaWindow(label,window){if(!window)return `<div class="unk">${label==='week'?'week: no data':'5h: no data yet'}</div>`;const p=Math.round(window.used*100),reset=new Date(window.resets_at*1000).toLocaleTimeString();return `<div class="qr"><span>${label.toUpperCase()} · resets ${esc(reset)}</span><b>${p}%</b></div><div class="bar"><i class="${window.level}" style="width:${Math.min(100,p)}%"></i></div>`}
function agyPool(name,slug,pool,now){const view=agyPoolView(pool,now);if(!view)return `<div class="pool"><div class="pn">${name}</div><div class="pm">${slug}</div><div class="unk">no data yet</div></div>`;return `<div class="pool"><div class="pn">${name}</div><div class="pm">${slug}</div>${quotaWindow('5h',view.five_hour)}${quotaWindow('week',view.week)}<div class="upd">updated ${esc(view.age_text)}</div></div>`}
function drawQuota(){const now=Date.now()/1000;document.getElementById('quota').innerHTML=['claude','codex','agy'].map(v=>{const q=quota[v],title=v==='agy'?'agy · Google':v[0].toUpperCase()+v.slice(1),heading=`<div class="qh"><span class="mark">${MARKS[v]}</span>${title}</div>`;if(v==='agy')return `<div class="qc" style="--c:var(--google)">${heading}<div class="pools">${agyPool('Gemini','gemini-*',q?.gemini,now)}${agyPool('Claude &amp; GPT','claude-* · gpt-*',q?.claude_gpt,now)}</div></div>`;if(!q)return `<div class="qc">${heading}<div class="unk">no data yet</div></div>`;return `<div class="qc" style="--c:${COLORS[v]}">${heading}${[['5h',q.five_hour],['week',q.week]].map(([w,d])=>{if(!d||d.resets_at<now)return `<div class="unk">${w}: no data yet</div>`;const p=Math.round(d.used*100),level=quotaLevel(d.used,w);return `<div class="qr"><span>${w.toUpperCase()} · resets ${new Date(d.resets_at*1000).toLocaleTimeString()}</span><b>${p}%</b></div><div class="bar"><i class="${level}" style="width:${Math.min(100,p)}%"></i></div>`}).join('')}<div class="unk">updated ${ageText(now-q.updated)}</div></div>`}).join('')}
function node(a,kids){const group=statusGroup(a.status),run=group==='running',summary=a.summary||a.error||a.activity||'',time=fmt((a.end??Date.now()/1000)-a.start),label=a.status==='timeout'?'timeout':group==='failed'?'✗':group==='done'?'✓':'';return `<div class="node ${group} ${selected===a.id?'sel':''}" data-id="${esc(a.id)}"><span class="dot ${run?'run':group==='done'?'done':'fail'}"></span><span class="id">${label?`${label} `:''}${esc(a.id)}</span><span class="vend" style="background:${COLORS[a.agent]||'var(--ink)'}">${esc(a.agent)}</span><span class="meta">${esc(a.model)} ${esc(a.effort||'')}</span>${waveTag(a)?`<span class="wave">${esc(waveTag(a))}</span>`:''}<span class="tm">${time}</span>${run&&a.activity?`<span class="sum">${esc(a.activity)}</span>`:''}${(group==='failed'||(group==='done'&&statusFilter==='done'))&&summary?`<span class="sum">${esc(summary)}</span>`:''}${a.routed_from?`<span class="sw">↪ switched from ${esc(a.routed_from)} — ${esc(a.route_reason||'')}</span>`:''}</div>${kids?`<div class="kids">${tree(a.id)}</div>`:''}`}
function fmt(s){s=Math.max(0,Math.floor(s));return s<60?`${s}s`:s<3600?`${Math.floor(s/60)}m`: `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`}
function tree(parent,visible=filterTree(agents,statusFilter)){const children=parent==='-'?rootAgents(agents):Object.values(agents).filter(a=>a.parent===parent);return sortSiblings(children.filter(a=>visible.has(a.id)),Date.now()/1000).map(a=>node(a,Object.values(agents).some(c=>c.parent===a.id&&visible.has(c.id)))).join('')}
function setFilter(filter){statusFilter=filter;render()}
function render(){const total=counts(agents),visible=filterTree(agents,statusFilter),chips=[['running','●','running'],['done','✓','done'],['failed','✗','failed'],['all','','all']].map(([key,mark,label])=>`<span class="chip ${statusFilter===key?'on':''}" data-filter="${key}">${mark?`${mark} `:''}${label} ${total[key]}</span>`).join('');document.getElementById('counts').textContent='';const rows=tree('-',visible);document.getElementById('tree').innerHTML=`<div class="chips">${chips}</div><div class="tree-nodes">${rows||'<p class="empty">No agents yet.</p>'}</div>`;document.getElementById('updated').textContent='updated '+new Date().toLocaleTimeString()}
document.getElementById('tree').addEventListener('click',e=>{const chip=e.target.closest('.chip[data-filter]');if(chip){setFilter(chip.dataset.filter);return}const el=e.target.closest('.node[data-id]');if(el)selectAgent(el.dataset.id)});
function selectAgent(id){selected=id;events=[];render();drawPanel()};function closePanel(){selected='';events=[];document.getElementById('ptitle').textContent='Select an agent';document.getElementById('pmeta').textContent='';['log','conv','task'].forEach(x=>document.getElementById(x).innerHTML='')}
function showTab(id,el){tabId=id;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');['log','conv','task'].forEach(x=>document.getElementById(x).hidden=x!==id)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
function renderFetchErrors(){const el=document.getElementById('fetch-errors'),items=Object.entries(fetchErrors).filter(([,message])=>message);el.hidden=!items.length;el.textContent=items.map(([file,message])=>`${file}: ${message}`).join(' · ')}
function drawPanel(){const a=agents[selected];if(!a)return;document.getElementById('ptitle').textContent=a.id;document.getElementById('pmeta').textContent=`${a.agent} · ${a.dir||''}`;const bottom=el=>el.scrollHeight-el.scrollTop-el.clientHeight<24;for(const id of ['log','conv']){const el=document.getElementById(id),stick=bottom(el),arr=id==='conv'?conversation(events):events;el.innerHTML=arr.length?arr.map(e=>`<div class="ev"><div class="t">${new Date(e.ts*1000).toLocaleTimeString()}</div>${esc(e.text)}${e.detail?`<code>${esc(e.detail)}</code>`:''}</div>`).join(''):'<div class="empty">waiting for events…</div>';if(stick)el.scrollTop=el.scrollHeight}document.getElementById('task').innerHTML=`<b>Prompt</b>${events.filter(e=>e.kind==='prompt').map(e=>`<div class="msg">${esc(e.detail||e.text)}</div>`).join('')||'<div class="empty">waiting for events…</div>'}${a.routed_from?`<b>Routing</b><div class="msg">Switched from ${esc(a.routed_from)} — ${esc(a.route_reason||'')}</div>`:''}`;document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',['log','conv','task'][i]===tabId));['log','conv','task'].forEach(x=>document.getElementById(x).hidden=x!==tabId)}
async function poll(){const [st,qt]=await Promise.all([get('status.jsonl'),get('quota.json')]);if(st!==null)agents=reduceStatus(st);if(qt!==null){try{quota=JSON.parse(qt);fetchErrors['quota.json']=''}catch{fetchErrors['quota.json']='invalid JSON'}}drawQuota();for(const a of Object.values(agents))if(a.status==='running'||a.id===selected){const t=await get(a.id+'.events.jsonl');const ev=eventsFromResponse(t);if(t!==null)a.activity=latestActivity(ev);if(a.id===selected)events=ev}render();renderFetchErrors();if(selected)drawPanel()}
poll();setInterval(poll,2000);
</script></body></html>
